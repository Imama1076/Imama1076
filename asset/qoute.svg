<svg width="100%" height="120" viewBox="0 0 850 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Blue Radial Glow Background -->
    <radialGradient id="quoteBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1d37" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#050b14" stop-opacity="0.98"/>
    </radialGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base & Subtle Border -->
  <rect width="850" height="120" rx="10" fill="#060c16" />
  <rect width="850" height="120" rx="10" fill="url(#quoteBg)" />
  <rect width="848" height="118" x="1" y="1" rx="9" fill="none" stroke="#0077b5" stroke-opacity="0.4" stroke-width="1.2" />

  <!-- Corner Brackets (Cyan / Neon Blue) -->
  <path d="M 10 28 L 10 10 L 28 10" stroke="#00d2ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 840 28 L 840 10 L 822 10" stroke="#00d2ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 10 92 L 10 110 L 28 110" stroke="#00d2ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 840 92 L 840 110 L 822 110" stroke="#00d2ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Centered Decorative Glowing Quotes -->
  <text x="50%" y="38" text-anchor="middle" fill="#00d2ff" font-size="26" font-family="'Georgia', serif" font-weight="bold" filter="url(#cyanGlow)" opacity="0.85">“</text>

  <!-- Centered Main Quote (Thoda Bada Size: 16px) -->
  <text x="50%" y="64" text-anchor="middle" fill="#f0f6fc" font-size="16" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="500" font-style="italic" letter-spacing="0.5">
    "Simplicity is prerequisite for reliability."
  </text>

  <!-- Centered Author Attribution -->
  <text x="50%" y="94" text-anchor="middle" fill="#38bdf8" font-size="12" font-family="'Courier New', monospace" font-weight="600" letter-spacing="1.2">
    — EDSGER W. DIJKSTRA
  </text>
</svg>
