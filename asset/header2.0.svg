<svg width="100%" height="165" viewBox="0 0 1000 165" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Blue Radial Glow Background -->
    <radialGradient id="bgGradBlueWide" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1d37" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050b14" stop-opacity="1"/>
    </radialGradient>

    <!-- Cyan Tech Grid Pattern -->
    <pattern id="techGridBlueWide" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#00d2ff" stroke-width="0.7" stroke-opacity="0.1"/>
    </pattern>

    <!-- Electric Blue Glow Filter -->
    <filter id="blueGlowWide" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1000" height="165" rx="12" fill="#040910" />
  <rect width="1000" height="165" rx="12" fill="url(#bgGradBlueWide)" />
  <rect width="1000" height="165" rx="12" fill="url(#techGridBlueWide)" />
  <rect width="998" height="163" x="1" y="1" rx="11" fill="none" stroke="#0077b5" stroke-opacity="0.45" stroke-width="1.2" />

  <!-- Corner Brackets (Cyan / Neon Blue) -->
  <path d="M 12 30 L 12 12 L 30 12" stroke="#00d2ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 988 30 L 988 12 L 970 12" stroke="#00d2ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 12 135 L 12 153 L 30 153" stroke="#00d2ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 988 135 L 988 153 L 970 153" stroke="#00d2ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Top Center Status Capsule -->
  <rect x="355" y="14" width="290" height="24" rx="12" fill="#091424" stroke="#00d2ff" stroke-opacity="0.6" stroke-width="1"/>
  <circle cx="370" cy="26" r="3.5" fill="#00d2ff" filter="url(#blueGlowWide)"/>
  <text x="382" y="29.5" fill="#38bdf8" font-size="10.5" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" letter-spacing="0.8">
    Building Real-World Digital Solutions
  </text>

  <!-- Main Headline Name -->
  <text x="500" y="80" text-anchor="middle" fill="#f0f6fc" font-size="30" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="800" letter-spacing="2.5">
    AMAMA FAYYAZ
  </text>

  <!-- Line Under Name: Roles & Stack -->
  <text x="500" y="106" text-anchor="middle" fill="#00d2ff" font-size="12" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="600" letter-spacing="0.6">
    Web Developer | WordPress Developer | AI-Assisted Engineer | PHP &amp; Laravel
  </text>

  <!-- Center Accent Diamond -->
  <g transform="translate(500, 124)">
    <rect x="-4" y="-4" width="8" height="8" rx="1" fill="#00d2ff" filter="url(#blueGlowWide)" transform="rotate(45)"/>
  </g>

  <!-- Bottom Monospace Tag -->
  <text x="500" y="146" text-anchor="middle" fill="#93c5fd" font-size="11" font-family="'Courier New', monospace" font-weight="600" letter-spacing="1">
    &lt;/&gt; Turning Ideas Into Real-World Solutions
  </text>
</svg>
