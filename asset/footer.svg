<svg width="100%" height="55" viewBox="0 0 800 55" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cyan & Electric Blue Gradient Lines -->
    <linearGradient id="lineGradLeftBlue" x1="160" y1="18" x2="340" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00d2ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#00d2ff" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="lineGradRightBlue" x1="460" y1="18" x2="640" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0077b5" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#0077b5" stop-opacity="0"/>
    </linearGradient>

    <!-- Cyan Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Centered Top Accent Lines (Border: 160 to 640, Center = 400) -->
  <line x1="160" y1="18" x2="340" y2="18" stroke="url(#lineGradLeftBlue)" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- Glowing Center Diamond & Symmetric Dots (Center = 400) -->
  <circle cx="368" cy="18" r="2.5" fill="#38bdf8" opacity="0.85"/>
  <rect x="394" y="12" width="12" height="12" rx="2.5" transform="rotate(45 400 18)" fill="#00d2ff" filter="url(#cyanGlow)"/>
  <circle cx="432" cy="18" r="2.5" fill="#38bdf8" opacity="0.85"/>
  
  <line x1="460" y1="18" x2="640" y2="18" stroke="url(#lineGradRightBlue)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Exactly Centered Text Along Axis x=400 -->
  <text x="400" y="42" text-anchor="middle" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="1.5">
    <tspan fill="#8b949e">DESIGNED &amp; BUILT BY </tspan><tspan fill="#00d2ff" font-weight="700">AMAMA FAYYAZ</tspan>
  </text>
</svg>
